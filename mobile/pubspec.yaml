name: umkmate
description: "UMKMate - Sistem Informasi Manajemen Warung Madura dan Toko Kelontong."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Local Storage & Session
  shared_preferences: ^2.3.2

  # Formatting & Localized Text
  intl: ^0.19.0

  # Typography
  google_fonts: ^6.2.1

  # Analytics Charts
  fl_chart: ^0.69.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
